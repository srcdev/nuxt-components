name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Upgrade npm
        # actions/setup-node bundles an older npm with each Node version (Node 20/22's images
        # ship npm ~10.8/10.9). That older npm's arborist has known crashes resolving this
        # repo's `overrides` field against the storybook peer-conflict chain (e.g.
        # "Cannot read properties of null (reading 'edgesOut')") that a current npm doesn't hit.
        run: npm install -g npm@latest

      - name: Install dependencies (with npm bug workaround)
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Run tests
        run: npm test -- --run

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upgrade npm
        # actions/setup-node bundles an older npm with each Node version (Node 20/22's images
        # ship npm ~10.8/10.9). That older npm's arborist has known crashes resolving this
        # repo's `overrides` field against the storybook peer-conflict chain (e.g.
        # "Cannot read properties of null (reading 'edgesOut')") that a current npm doesn't hit.
        run: npm install -g npm@latest

      - name: Install dependencies (with npm bug workaround)
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build project
        run: npm run build
