name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Reads .nvmrc directly — bump that file and both this job and the build job below
          # follow automatically, no version duplicated here to fall out of sync.
          node-version-file: ".nvmrc"

      - name: Upgrade npm
        # actions/setup-node bundles an older npm with each Node version (Node 20/22's images
        # ship npm ~10.8/10.9). That older npm's arborist has known crashes resolving this
        # repo's `overrides` field against the storybook peer-conflict chain (e.g.
        # "Cannot read properties of null (reading 'edgesOut')") that a current npm doesn't hit.
        # Node 20 was dropped entirely (see .nvmrc) because npm@latest now requires
        # Node ^22.22.2 || ^24.15.0 || >=26.0.0 and can't run on Node 20 at all (EBADENGINE).
        run: npm install -g npm@latest

      - name: Install dependencies (with npm bug workaround)
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Run tests
        run: npm test -- --run

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies (with npm bug workaround)
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build project
        run: npm run build
